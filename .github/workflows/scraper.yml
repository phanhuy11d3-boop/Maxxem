name: CryptoSentinel Scraper

on:
  schedule:
    - cron: '* * * * *'  # Chạy tự động mỗi 1 phút
  workflow_dispatch:       # Nút bấm chạy thủ công trên GitHub UI

jobs:
  scrape:
    runs-on: ubuntu-latest
    # GH Actions không tôn trọng cron mỗi-phút (thực tế 1.5–4.5h/lần). Workaround:
    # mỗi run là một "ca trực" tự loop ~5h30 (dưới trần 6h của job), mỗi phút một vòng.
    # Run kế tiếp xếp hàng nhờ concurrency group → hết ca là vào thay, phủ gần kín 24/7.
    timeout-minutes: 350
    concurrency:
      group: cryptosentinel-scraper
      cancel-in-progress: false
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip' # Tối ưu tốc độ cài thư viện

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run CryptoSentinel Pipeline (loop ~5h30, mỗi phút một vòng)
        run: |
          END=$((SECONDS + 19800))
          i=0
          while [ "$SECONDS" -lt "$END" ]; do
            i=$((i + 1))
            t0=$SECONDS
            echo "=== vòng $i — $(date -u '+%Y-%m-%d %H:%M:%S') UTC ==="
            python main.py || echo "::warning::vòng $i lỗi (exit $?) — tiếp tục ca trực"
            d=$((SECONDS - t0))
            if [ "$d" -lt 60 ]; then sleep $((60 - d)); fi
          done
          echo "Hết ca sau $i vòng."
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # Ca đêm dùng Groq (endpoint public, OpenAI-compatible). Chỉ key là secret;
          # base URL + tên model để thẳng ở đây cho dễ đổi. Ca ngày trên máy operator
          # dùng 9Router localhost qua .env — hai ca chung DB nên không trùng tin.
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: https://api.groq.com/openai/v1
          LLM_MODEL: llama-3.3-70b-versatile
          LLM_MODEL_FAST: llama-3.1-8b-instant
          UW_API_KEY: ${{ secrets.UW_API_KEY }}
          ARKHAM_API_KEY: ${{ secrets.ARKHAM_API_KEY }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          ENABLE_OPS_TELEMETRY: "0"
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
          HEARTBEAT_CHAT_ID: ${{ secrets.HEARTBEAT_CHAT_ID }}
          PREMIUM_CHAT_ID: ${{ secrets.PREMIUM_CHAT_ID }}
