name: CryptoSentinel Scraper

on:
  schedule:
    - cron: '* * * * *'  # Chạy tự động mỗi 1 phút
  workflow_dispatch:       # Nút bấm chạy thủ công trên GitHub UI

jobs:
  scrape:
    runs-on: ubuntu-latest
    # GH Actions không tôn trọng cron mỗi-phút (thực tế 1.5–4.5h/lần). Workaround:
    # mỗi run là một "ca trực" tự loop ~5h30 (dưới trần 6h của job), mỗi phút một vòng.
    # Run kế tiếp xếp hàng nhờ concurrency group → hết ca là vào thay, phủ gần kín 24/7.
    timeout-minutes: 350
    concurrency:
      group: cryptosentinel-scraper
      cancel-in-progress: false
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip' # Tối ưu tốc độ cài thư viện

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run CryptoSentinel Pipeline (loop ~5h30, mỗi phút một vòng)
        # Timeout ở mức step (ngắn hơn trần job 350) để nếu loop treo,
        # step "Giao ca" phía dưới vẫn kịp chạy và dispatch ca kế tiếp.
        timeout-minutes: 340
        run: |
          END=$((SECONDS + 19800))
          i=0
          while [ "$SECONDS" -lt "$END" ]; do
            i=$((i + 1))
            t0=$SECONDS
            echo "=== vòng $i — $(date -u '+%Y-%m-%d %H:%M:%S') UTC ==="
            python main.py || echo "::warning::vòng $i lỗi (exit $?) — tiếp tục ca trực"
            d=$((SECONDS - t0))
            if [ "$d" -lt 60 ]; then sleep $((60 - d)); fi
          done
          echo "Hết ca sau $i vòng."
        env:
          # v3 DEX-only: không còn LLM/RSS — chỉ cần DB + Telegram.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          ENABLE_OPS_TELEMETRY: "0"
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
          HEARTBEAT_CHAT_ID: ${{ secrets.HEARTBEAT_CHAT_ID }}
          PREMIUM_CHAT_ID: ${{ secrets.PREMIUM_CHAT_ID }}

      - name: Giao ca — tự dispatch shift kế tiếp
        # Scheduler GH bị throttle nên không thể dựa vào cron để xếp ca mới kịp lúc
        # (đã đo gap 115 phút ở vùng giao ca). Ca tự "đẻ" ca kế tiếp qua API.
        # GITHUB_TOKEN mặc định bị chặn tự kích hoạt workflow (chống đệ quy) → cần PAT.
        # Thiếu PAT thì chỉ cảnh báo và quay về dựa cron như cũ — không fail run.
        if: always()
        env:
          WORKFLOW_PAT: ${{ secrets.WORKFLOW_PAT }}
        run: |
          if [ -z "$WORKFLOW_PAT" ]; then
            echo "::warning::Chưa có secret WORKFLOW_PAT — bỏ qua tự giao ca, chờ cron throttled."
            exit 0
          fi
          code=$(curl -sS -o /tmp/dispatch_resp.txt -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $WORKFLOW_PAT" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/scraper.yml/dispatches" \
            -d '{"ref":"main"}')
          if [ "$code" = "204" ]; then
            echo "Đã dispatch ca kế tiếp (HTTP 204)."
          else
            cat /tmp/dispatch_resp.txt
            echo "::warning::Dispatch ca kế tiếp thất bại (HTTP $code) — cron sẽ đỡ."
          fi
