name: CryptoSentinel CI Guard

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  guard:
    name: Code Quality & Security Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      # ── Bảo mật: không được hardcode secrets vào code ──────────────────────
      - name: "[Security] No hardcoded API keys"
        run: |
          if grep -rn "gsk_" --include="*.py" .; then
            echo "❌ FAIL: Phát hiện API key bị hardcode trong .py file!"
            exit 1
          fi
          echo "✅ PASS: Không có API key bị hardcode."

      - name: "[Security] No hardcoded DATABASE_URL"
        run: |
          if grep -rn "postgresql://" --include="*.py" .; then
            echo "❌ FAIL: Phát hiện Database URL bị hardcode trong .py file!"
            exit 1
          fi
          echo "✅ PASS: Không có Database URL bị hardcode."

      # ── Kiến trúc: ngăn hồi sinh đường news/LLM đã xóa (pivot 2026-06-12) ──
      - name: "[Architecture] No legacy news/LLM imports"
        run: |
          if grep -rnE "from (models\.article|scrapers\.generic_rss|scrapers\.fast_signals|processors)|import (feedparser|openai)" --include="*.py" .; then
            echo "❌ FAIL: Phát hiện import từ đường news/LLM đã xóa. Sản phẩm là DEX-only."
            exit 1
          fi
          echo "✅ PASS: Không có tàn dư news/LLM."

      # ── Chất lượng code: validate model không bị vỡ ──────────────────────
      - name: "[Test] Validate PairSignal model (Smoke Test)"
        run: python models/signal.py

      - name: "[Test] Compile core"
        run: python -m py_compile main.py models/signal.py storage/postgres.py scrapers/dexscreener.py utils/notifier.py

      - name: "[Test] Run Unit Tests"
        run: python -m pytest tests/unit -q
